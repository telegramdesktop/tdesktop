---
version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Git submodules (for third-party dependencies)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # CMake dependencies (if any CMake-specific package managers are used)
  - package-ecosystem: "github-actions"
    directory: "/cmake"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
