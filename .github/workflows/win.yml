name: Telegram Python - Windows x64 Qt6 Release

on:
  push:
    branches:
      - python-plugins

  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 Qt6 Release
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py

    defaults:
      run:
        shell: cmd

    steps:

      # ------------------------------------------------------------
      # Prepare build directories
      # ------------------------------------------------------------

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild

          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      # ------------------------------------------------------------
      # Repository name
      # ------------------------------------------------------------

      - name: Get repository name
        shell: bash
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ github.event.repository.name }}

      # ------------------------------------------------------------
      # Detect Windows SDK used by Telegram Desktop
      # ------------------------------------------------------------

      - name: Detect Windows SDK
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"

          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"

          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "Detected SDK: $SDK"

      # ------------------------------------------------------------
      # Generate cache key
      # ------------------------------------------------------------

      - name: Generate cache key
        shell: bash
        run: |
          sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }' > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt

          CACHE_KEY="$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')"

          echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # MSVC x64
      # ------------------------------------------------------------

      - name: MSVC x64 environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      # ------------------------------------------------------------
      # NuGet
      # ------------------------------------------------------------

      - name: Configure NuGet
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # ------------------------------------------------------------
      # ThirdParty cache
      # ------------------------------------------------------------

      - name: ThirdParty cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: windows-x64-thirdparty-${{ env.CACHE_KEY }}
          restore-keys: |
            windows-x64-thirdparty-

      # ------------------------------------------------------------
      # Telegram libraries cache
      # ------------------------------------------------------------

      - name: Libraries cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: windows-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: |
            windows-x64-libs-v2-

      # ------------------------------------------------------------
      # Qt6 cache
      # ------------------------------------------------------------

      - name: Qt6 cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: windows-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: |
            windows-x64-qt6-

      # ------------------------------------------------------------
      # Prepare Telegram dependencies
      # ------------------------------------------------------------

      - name: Prepare Telegram libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      # ------------------------------------------------------------
      # Our Python runtime currently lives in:
      #
      # repo/python_plugins
      #
      # The current CMake bridge also expects Telegram/python_plugins
      # during its post-build copy, so stage a copy there.
      # ------------------------------------------------------------

      - name: Stage Python plugin runtime
        run: |
          if not exist "%TBUILD%\%REPO_NAME%\python_plugins\_tdesktop_host.py" (
            echo ERROR: python_plugins\_tdesktop_host.py not found
            exit /b 1
          )

          if exist "%TBUILD%\%REPO_NAME%\Telegram\python_plugins" (
            rmdir /s /q "%TBUILD%\%REPO_NAME%\Telegram\python_plugins"
          )

          xcopy ^
          "%TBUILD%\%REPO_NAME%\python_plugins" ^
          "%TBUILD%\%REPO_NAME%\Telegram\python_plugins\" ^
          /E /I /Y

      # ------------------------------------------------------------
      # Check Telegram API credentials
      #
      # Create these GitHub Actions secrets:
      #
      # TDESKTOP_API_ID
      # TDESKTOP_API_HASH
      # ------------------------------------------------------------

      - name: Check Telegram API credentials
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_ID)) {
              throw "GitHub secret TDESKTOP_API_ID is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_HASH)) {
              throw "GitHub secret TDESKTOP_API_HASH is not configured."
          }

          Write-Host "Telegram API credentials are configured."

      # ------------------------------------------------------------
      # Free disk space
      # ------------------------------------------------------------

      - name: Free disk space
        shell: bash
        run: |
          find "$LibrariesPath" \
          '(' \
            '(' \
              ! '(' \
                -name '*.lib' \
                -o -name '*.a' \
                -o -name '*.exe' \
                -o -name '*.h' \
                -o -name '*.hpp' \
                -o -name '*.inc' \
                -o -name '*.cmake' \
                -o -name '*.pc' \
                -o -path '*/include/*' \
                -o -path '*/objects-*' \
                -o -path '*/cache_keys/*' \
                -o -path '*/patches/*' \
                -o -path '*/nv-codec-headers/*' \
              ')' \
              -type f \
            ')' \
            -o -empty \
          ')' -delete

      # ------------------------------------------------------------
      # Configure Telegram
      # ------------------------------------------------------------

      - name: Configure Telegram
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
          -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      # ------------------------------------------------------------
      # Build ONLY Telegram x64 Qt6 Release
      # ------------------------------------------------------------

      - name: Build Telegram
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          cmake --build ..\out ^
          --config Release ^
          --target Telegram ^
          --parallel

      # ------------------------------------------------------------
      # Prepare artifact
      # ------------------------------------------------------------

      - name: Prepare artifact
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release

          if not exist "%OUT%\Telegram.exe" (
            echo ERROR: Telegram.exe was not built.
            exit /b 1
          )

          mkdir artifact

          copy ^
          "%OUT%\Telegram.exe" ^
          "artifact\Telegram.exe"

          if exist "%OUT%\python_plugins\_tdesktop_host.py" (
            xcopy ^
            "%OUT%\python_plugins" ^
            "artifact\python_plugins\" ^
            /E /I /Y
          ) else (
            xcopy ^
            "%TBUILD%\%REPO_NAME%\python_plugins" ^
            "artifact\python_plugins\" ^
            /E /I /Y
          )

      # ------------------------------------------------------------
      # Add portable Python
      #
      # Telegram bridge searches:
      #
      # Telegram.exe
      # python\python.exe
      # ------------------------------------------------------------

      - name: Add portable Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Version = "3.13.14"

          $Url = "https://www.python.org/ftp/python/$Version/python-$Version-embed-amd64.zip"

          $Zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"

          $Destination = Join-Path $env:GITHUB_WORKSPACE "artifact\python"

          Write-Host "Downloading portable Python $Version"
          Write-Host $Url

          Invoke-WebRequest `
            -Uri $Url `
            -OutFile $Zip

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $Destination | Out-Null

          Expand-Archive `
            -Path $Zip `
            -DestinationPath $Destination `
            -Force

          if (!(Test-Path "$Destination\python.exe")) {
              throw "Portable python.exe was not extracted."
          }

          Write-Host "Portable Python OK."

      # ------------------------------------------------------------
      # Verify final package
      # ------------------------------------------------------------

      - name: Verify package
        shell: pwsh
        run: |
          $Root = Join-Path $env:GITHUB_WORKSPACE "artifact"

          $Telegram = Join-Path $Root "Telegram.exe"
          $Python = Join-Path $Root "python\python.exe"
          $Host = Join-Path $Root "python_plugins\_tdesktop_host.py"
          $Plugins = Join-Path $Root "python_plugins\plugins"

          if (!(Test-Path $Telegram)) {
              throw "Telegram.exe missing."
          }

          if (!(Test-Path $Python)) {
              throw "python\python.exe missing."
          }

          if (!(Test-Path $Host)) {
              throw "python_plugins\_tdesktop_host.py missing."
          }

          if (!(Test-Path $Plugins)) {
              throw "python_plugins\plugins directory missing."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host " Telegram Python package is READY"
          Write-Host "======================================"
          Write-Host ""

          Get-ChildItem $Root -Recurse |
            Select-Object FullName

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-Python-Windows-x64-Qt6-Release
          path: artifact\
          retention-days: 7
          if-no-files-found: error
