name: Telegram Python - Windows x64 Qt6 Release

on:
  push:
    branches:
      - python-plugins

  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 Qt6 Release
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py

    defaults:
      run:
        shell: cmd

    steps:
      # ------------------------------------------------------------
      # Prepare TBuild directory
      # ------------------------------------------------------------

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild

          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      # ------------------------------------------------------------
      # Repository name
      # ------------------------------------------------------------

      - name: Get repository name
        shell: bash
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild/${{ github.event.repository.name }}

      # ------------------------------------------------------------
      # Detect required Windows SDK
      # ------------------------------------------------------------

      - name: Detect Windows SDK
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"

          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"

          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "Windows SDK: $SDK"

      # ------------------------------------------------------------
      # Cache key
      # ------------------------------------------------------------

      - name: Generate cache key
        shell: bash
        run: |
          echo "$(sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt

          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # MSVC x64
      # ------------------------------------------------------------

      - name: MSVC x64 environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      # ------------------------------------------------------------
      # NuGet
      # ------------------------------------------------------------

      - name: Configure NuGet
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # ------------------------------------------------------------
      # ThirdParty cache
      # ------------------------------------------------------------

      - name: ThirdParty cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: windows-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            windows-x64-third-party-

      # ------------------------------------------------------------
      # Telegram libraries cache
      # ------------------------------------------------------------

      - name: Libraries cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: windows-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: |
            windows-x64-libs-v2-

      # ------------------------------------------------------------
      # Qt6 cache
      # ------------------------------------------------------------

      - name: Qt6 cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: windows-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: |
            windows-x64-qt6-

      # ------------------------------------------------------------
      # Build Telegram dependencies
      # ------------------------------------------------------------

      - name: Prepare Telegram libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      # ------------------------------------------------------------
      # Free some disk space
      # ------------------------------------------------------------

      - name: Free disk space
        shell: bash
        run: |
          find "$LibrariesPath" \
          '(' \
            '(' \
              ! '(' \
                -name '*.lib' \
                -o -name '*.a' \
                -o -name '*.exe' \
                -o -name '*.h' \
                -o -name '*.hpp' \
                -o -name '*.inc' \
                -o -name '*.cmake' \
                -o -name '*.pc' \
                -o -path '*/include/*' \
                -o -path '*/objects-*' \
                -o -path '*/cache_keys/*' \
                -o -path '*/patches/*' \
                -o -path '*/nv-codec-headers/*' \
              ')' \
              -type f \
            ')' \
            -o -empty \
          ')' -delete

      # ------------------------------------------------------------
      # Configure Telegram
      #
      # These are the public/open credentials used by the upstream
      # Telegram Desktop build workflow for open builds.
      # ------------------------------------------------------------

      - name: Configure Telegram x64 Qt6 Release
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_ID=611335 ^
          -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      # ------------------------------------------------------------
      # Build ONLY Telegram.exe
      # ------------------------------------------------------------

      - name: Build Telegram
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          cmake --build ..\out ^
          --config Release ^
          --target Telegram ^
          --parallel

      # ------------------------------------------------------------
      # Create artifact directory
      # ------------------------------------------------------------

      - name: Prepare artifact
        run: |
          mkdir artifact

          copy ^
          "%TBUILD%\%REPO_NAME%\out\Release\Telegram.exe" ^
          "artifact\Telegram.exe"

      # ------------------------------------------------------------
      # Copy Python plugin runtime
      # ------------------------------------------------------------

      - name: Copy Python plugins
        run: |
          xcopy ^
          "%TBUILD%\%REPO_NAME%\python_plugins" ^
          "artifact\python_plugins\" ^
          /E /I /Y

      # ------------------------------------------------------------
      # Download portable Python
      # ------------------------------------------------------------

      - name: Download portable Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Version = "3.14.7"

          $Url = "https://www.python.org/ftp/python/$Version/python-$Version-embed-amd64.zip"

          $Zip = Join-Path $env:RUNNER_TEMP "python.zip"

          Write-Host "Downloading Python $Version..."
          Write-Host $Url

          Invoke-WebRequest `
            -Uri $Url `
            -OutFile $Zip

          $PythonDir = Join-Path $env:GITHUB_WORKSPACE "artifact\python"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $PythonDir | Out-Null

          Expand-Archive `
            -Path $Zip `
            -DestinationPath $PythonDir `
            -Force

          Write-Host "Portable Python installed:"
          Get-ChildItem $PythonDir

      # ------------------------------------------------------------
      # Verify package
      # ------------------------------------------------------------

      - name: Verify artifact
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================="
          Write-Host " Telegram Python package"
          Write-Host "======================================="

          Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\artifact" `
            -Recurse |
            Select-Object FullName

          $Telegram = "$env:GITHUB_WORKSPACE\artifact\Telegram.exe"
          $Python   = "$env:GITHUB_WORKSPACE\artifact\python\python.exe"
          $Host     = "$env:GITHUB_WORKSPACE\artifact\python_plugins\_tdesktop_host.py"

          if (!(Test-Path $Telegram)) {
              throw "Telegram.exe not found!"
          }

          if (!(Test-Path $Python)) {
              throw "Portable Python not found!"
          }

          if (!(Test-Path $Host)) {
              throw "Python plugin host not found!"
          }

          Write-Host ""
          Write-Host "Package verification OK."

      # ------------------------------------------------------------
      # Upload ready-to-run package
      # ------------------------------------------------------------

      - name: Upload Telegram Python artifact
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-Python-Windows-x64-Qt6-Release
          path: artifact\
          retention-days: 7
          if-no-files-found: error
