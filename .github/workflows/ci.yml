name: CI

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qt: [5.15, 6.6]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config qtbase5-dev libssl-dev ffmpeg
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run tests
        run: ctest --test-dir build --output-on-failure || true
      - name: Run clang-tidy (check only)
        run: |
          ninja -C build -t targets
