# SonarCloud configuration for tdesktop
sonar.projectKey=Elpablo777_tdesktop
sonar.organization=elpablo777

# Project information
sonar.projectName=Telegram Desktop (Fork)
sonar.projectVersion=5.0
sonar.projectDescription=Official Telegram Desktop messenger - Security Enhanced Fork

# Source settings
sonar.sources=Telegram/SourceFiles
sonar.sourceEncoding=UTF-8
sonar.language=cpp

# Test settings  
sonar.tests=Telegram/SourceFiles/tests
sonar.test.inclusions=**/*_test.cpp,**/*_tests.cpp
sonar.test.exclusions=**/*.h

# Coverage settings
sonar.cfamily.gcov.reportsPath=build/coverage
sonar.cfamily.llvm-cov.reportPath=build/coverage/coverage.txt

# Build wrapper
sonar.cfamily.build-wrapper-output=build/sonar

# Quality Gate settings
sonar.qualitygate.wait=true

# Analysis exclusions
sonar.exclusions=Telegram/ThirdParty/**,**/moc_*.cpp,**/qrc_*.cpp,**/*.pb.cc,**/*.pb.h

# CPP specific settings
sonar.cfamily.cache.enabled=true
sonar.cfamily.cache.path=build/.sonar-cache
sonar.cfamily.threads=4

# Security hotspots and vulnerabilities focus
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S*
sonar.issue.ignore.multicriteria.e1.resourceKey=Telegram/ThirdParty/**
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S*  
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*_test.cpp
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/moc_*.cpp